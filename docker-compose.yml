services:
  db:
    image: postgres:16-alpine
    container_name: coral-db
    environment:
      POSTGRES_USER: coral
      POSTGRES_PASSWORD: coral
      POSTGRES_DB: coral
    ports:
      - "5433:5432"
    volumes:
      - coral-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coral -d coral"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  coral-pgdata:
